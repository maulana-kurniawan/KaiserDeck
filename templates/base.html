<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kaiser Deck{% endblock %} - Play! Emulator</title>
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo.png') }}">

    <!-- Google Fonts: Public Sans & Noto Color Emoji -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Noto+Color+Emoji&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.0">
</head>
<body class="theme-{% block theme_name %}default{% endblock %}">
    <header class="m3-app-bar">
        <div class="m3-app-bar-container">
            <a href="{{ url_for('index') }}" class="m3-brand">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Kaiser Deck Logo" class="m3-brand-logo">
                <span class="m3-brand-title">Kaiser<strong>Deck</strong></span>
                <span class="m3-badge-version">v2.0</span>
            </a>

            <!-- Top Navbar Pills: Scan Barcode & Card List -->
            <nav class="m3-nav-pills">
                <a href="{{ url_for('index') }}" class="m3-nav-pill {% if request.path == '/' or request.endpoint == 'index' %}active{% endif %}">
                    <span class="noto-emoji">📷</span>
                    <span>Scan Barcode</span>
                </a>
                <a href="{{ url_for('cards') }}" class="m3-nav-pill {% if request.endpoint in ['cards', 'collection_animal', 'collection_strong', 'collection_miracle'] %}active{% endif %}">
                    <span class="noto-emoji">🎴</span>
                    <span>Card List</span>
                </a>
            </nav>

            <div class="m3-status-chip" id="statusPill" title="Play! Emulator Connection Status">
                <span class="m3-status-dot" id="statusDot"></span>
                <span class="m3-status-text" id="statusLabel">Checking Emulator...</span>
                <button type="button" class="m3-btn-icon" id="btnCheckStatus" title="Refresh connection status">↻</button>
            </div>
        </div>
    </header>

    <main class="m3-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Toast Notification -->
    <div id="toast" class="m3-snackbar toast" role="alert" aria-live="polite"></div>

    <footer class="m3-footer">
        <div class="m3-footer-inner">
            <p><strong>Kaiser Deck v2.0</strong> &bull; Animal Kaiser Arcade Barcode I/O for <strong>Play! Emulator</strong></p>
            <p class="m3-credit">Developed by <a href="https://github.com/maulana-kurniawan" target="_blank" rel="noopener"><strong>@maulana-kurniawan</strong></a> &bull; Built with <strong>Gemini 3.8 Flash</strong> ⚡</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/JsBarcode.all.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

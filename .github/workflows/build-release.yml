name: Build & Release Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm KaiserDeck.spec

      - name: Verify Compiled Binary
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\\KaiserDeck.exe")) {
            Write-Error "KaiserDeck.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist\\KaiserDeck.exe").Length
          Write-Host "KaiserDeck.exe successfully generated! Size: $size bytes"

      - name: Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KaiserDeck-Windows
          path: dist/KaiserDeck.exe
          retention-days: 30

      - name: Determine Release Tag, Title, and Changelog
        id: release_info
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python .github/scripts/generate_release_notes.py

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist/KaiserDeck.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
